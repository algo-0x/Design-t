<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoneX Arena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.wrapper{
    width:100vw;
    height:100vh;
    overflow:hidden;
}

iframe{
    width:100%;
    height:calc(100vh + 10px);
    border:none;
    display:block;
    margin-bottom:-10px;
}
</style>
</head>
<body>

<div class="wrapper">
    <iframe
        src="https://zonex-arena.lovable.app"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
